name: Bug report
description: Something in NetScope does not work as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, real email addresses or other personal data. Report security issues privately through the Security tab instead.
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [IP & Location, Speed Test, Breach Check, Password Generator, DNS & Security, Full Scan, Export, Sign-in, Landing or About page, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: 1. Open the app 2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Safari 19 on macOS, Chrome 140 on Android
    validations:
      required: true
